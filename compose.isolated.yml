services:
  app:
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - isolated_uploads:/var/www/html/public/content/uploads

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - isolated_db_data:/var/lib/mysql
      # An optional sanitized .sql or .sql.gz dump is loaded on first start.
      # scripts/compose.sh passes one directory shared by all Git worktrees.
      - ${WORDPRESS_SNAPSHOT_DIR:-./infra/snapshots}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  isolated_db_data:
  isolated_uploads:
