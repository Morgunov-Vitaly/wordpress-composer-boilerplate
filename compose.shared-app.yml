services:
  app:
    networks:
      - default
      - shared_db
    volumes:
      - shared_uploads:/var/www/html/public/content/uploads

  nginx:
    networks:
      - default
    volumes:
      - shared_uploads:/var/www/html/public/content/uploads:ro

networks:
  shared_db:
    external: true
    name: wordpress-shared-db

volumes:
  shared_uploads:
    external: true
    name: wordpress-shared-uploads
